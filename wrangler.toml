name = "filecove"
main = "src/index.js"
compatibility_date = "2025-06-01"

# 绑定 R2 存储桶（R2 绑定模式时使用；bucket_name 按你创建的桶名填写）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "filecove"

# D1 数据库：database_id 不用手填——
#   GitHub Actions 部署时会自动建库并把 id 写进来；本地跑 `npm run setup` 也一样。
#   只有走 Cloudflare 网页端「连接 GitHub」部署时，才需要手动填一次。
[[d1_databases]]
binding = "DB"
database_name = "filecove"
database_id = "待自动填充（Actions / npm run setup 会自动写入）"

# —— 关于环境变量（重要）——
# 这里【故意不声明 [vars]】。wrangler deploy 会把配置文件里的 vars 同步到 Worker，
# 一旦声明，你在控制台改的值（比如 PUBLIC_BASE_URL）每次部署都会被冲回默认值。
#
# 不声明 = 部署不会覆盖你在控制台配的任何变量，改一次永久生效。
# 所有变量在代码里都有默认值，不配也能跑（见下面注释里的默认值）。
#
# 想让 Actions 帮你写入变量的话，把 K=V 填进仓库变量 PRESET_VARS，例如：
#   PUBLIC_BASE_URL=https://cdn.example.com
#   DOWNLOAD_MODE=auto
# 留空则完全不碰，控制台的值 100% 保留。
#
# 可在 Workers → 设置 → 变量和机密 里添加（文本类型）：
#
# —— 直链相关（最关键）——
# PUBLIC_BASE_URL  桶的公网域名；填了下载就 302 到真直链，不经过 Worker（默认空）
# DOWNLOAD_MODE    auto / public / signed / proxy（默认 auto）
#
# —— 安全与限流 ——
# IP_MAX_DOWNLOADS        单 IP 每窗口下载上限（默认 30）
# IP_WINDOW_SECONDS       窗口秒数（默认 3600）
# BAN_MINUTES             超限自动封禁时长（默认 60）
# MONTHLY_TRAFFIC_LIMIT   月度流量上限字节，0 不限（默认 0）
#
# —— 上传 ——
# UPLOAD_MAX_SIZE         （默认 107374182400，即 100GB）
# MULTIPART_THRESHOLD     （默认 104857600，超 100MB 走分片）
# MULTIPART_PART_SIZE     （默认 16777216，16MB/片）
#
# —— 人机验证（可选）——
# TURNSTILE_SITEKEY  （默认空）
# TURNSTILE_ENABLED  （默认 0）
#
# —— 存储 ——
# STORAGE_DRIVER   auto / r2 / s3（默认 auto）
# R2_BUCKET_NAME   后台展示用的桶名（默认 "filecove"）

# 以下敏感项用 wrangler secret 设置，不要写进仓库：
# npx wrangler secret put ADMIN_PASSWORD
# npx wrangler secret put TURNSTILE_SECRET
# npx wrangler secret put S3_ACCESS_KEY_ID
# npx wrangler secret put S3_SECRET_ACCESS_KEY

# —— 若改用 S3 兼容存储/或让 R2 走 S3 API（推荐，支持浏览器直传+分片）——
# 在控制台 Workers → 设置 → 变量 里添加（密钥类用"加密"类型）：
# S3_ENDPOINT = "https://<accountid>.r2.cloudflarestorage.com"   # R2 示例
# S3_BUCKET = "filecove"
# S3_REGION = "auto"
# S3_FORCE_PATH_STYLE = "true"
