name: Deploy Filecove

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_resources:
        description: 跳过自动创建 D1 / R2（资源已存在时可选）
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 缺哪个 Secret 就提前说清楚，避免部署到一半才报错
      - name: 检查必需的 Secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          missing=()
          [ -z "$CF_API_TOKEN" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "$CF_ACCOUNT_ID" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -z "$ADMIN_PASSWORD" ] && missing+=("ADMIN_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少 Secrets：${missing[*]}"
            echo "请到仓库 Settings → Secrets and variables → Actions 添加后重跑。"
            exit 1
          fi
          echo "Secrets 检查通过"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # 自动建 D1 数据库（已存在则复用）、自动建 R2 桶，并把 database_id 写回 wrangler.toml
      - name: 准备 Cloudflare 资源（D1 + R2）
        id: resources
        if: ${{ !inputs.skip_resources }}
        run: node scripts/setup-resources.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 建表不是必需步骤：Worker 首次被访问时会自动建表，这里只是让它立即就绪
      - name: 初始化表结构
        id: schema
        continue-on-error: true
        run: npx wrangler d1 execute "${{ steps.resources.outputs.database-name || 'filecove' }}" --file=./schema.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: '0'

      # 只把「确实配了值」的密钥列进上传名单。
      # wrangler-action 对每个列出的名字都要求 env 里非空，否则直接失败，
      # 所以没开 Turnstile、没用 S3 时必须把它们排除掉。
      - name: 计算需要上传的密钥
        id: secret_names
        run: node scripts/ci-secrets.mjs
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: ${{ steps.secret_names.outputs.names }}
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

      - name: 部署结果
        run: |
          echo "### 部署完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1 数据库：\`${{ steps.resources.outputs.database-name || 'filecove' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- R2 存储桶：\`${{ steps.resources.outputs.bucket-name || 'filecove' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 别忘了在 Worker 设置里绑定自定义域名，并配置 PUBLIC_BASE_URL 让下载走直链" >> "$GITHUB_STEP_SUMMARY"
